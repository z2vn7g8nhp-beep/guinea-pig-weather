<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b121e">
  <meta name="description" content="豚豚气象台，随时查看城市实况、逐时天气和七日预报。">
  <meta name="weather-release" content="05419eef5207a031">
  <title>豚豚气象台 · 深夜观测站</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css?v=05419eef5207a031">
  <script src="icons.js?v=05419eef5207a031" defer></script>
  <script src="weather.js?v=05419eef5207a031" defer></script>
  <script src="app.js?v=05419eef5207a031" defer></script>
</head>
<body>
<div id="cavy-observatory">
  <article class="cavy-screen" data-motion="true" aria-label="豚豚气象台">
    <header class="cavy-top">
      <div class="cavy-brand">
        <img src="icon.png" width="32" height="32" alt="">
        <div class="cavy-brand-copy">
          <h1>豚豚气象台</h1>
          <span data-weather-status role="status">正在查询</span>
        </div>
      </div>
      <div class="cavy-tools">
        <button class="cavy-city" type="button" aria-haspopup="dialog" aria-label="切换城市，当前西安">
          <i data-lucide="map-pin" aria-hidden="true"></i><span data-city-name>西安</span><i data-lucide="chevron-down" aria-hidden="true"></i>
        </button>
        <button class="cavy-toolbar-icon" type="button" data-refresh aria-label="刷新天气" title="刷新天气">
          <i data-lucide="refresh-cw" aria-hidden="true"></i>
        </button>
        <details class="cavy-settings">
          <summary class="cavy-toolbar-icon" aria-label="天气设置" title="天气设置">
            <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
          </summary>
          <div class="cavy-settings-panel">
            <div class="cavy-settings-units">
              <span>温度单位</span>
              <div class="cavy-units" role="group" aria-label="温度单位">
                <button type="button" data-unit="C" aria-label="摄氏度" aria-pressed="true">°C</button>
                <button type="button" data-unit="F" aria-label="华氏度" aria-pressed="false">°F</button>
              </div>
            </div>
            <button class="cavy-settings-action" type="button" data-demo-toggle aria-expanded="false" aria-controls="cavy-weather-choices">
              <i data-lucide="cloud-sun" aria-hidden="true"></i><span data-demo-label>动效演示</span>
            </button>
            <button class="cavy-settings-action" type="button" data-motion-control>
              <span data-motion-icon aria-hidden="true"><i data-lucide="pause"></i></span>
              <span data-motion-label>暂停动效</span>
            </button>
          </div>
        </details>
      </div>
    </header>

    <div class="cavy-main">
      <div class="cavy-overview">
        <div class="cavy-choices" id="cavy-weather-choices" role="group" aria-label="天气演示" hidden>
          <button type="button" data-weather="clear" aria-pressed="false"><i data-lucide="sun" aria-hidden="true"></i>晴天</button>
          <button type="button" data-weather="cloudy" aria-pressed="false"><i data-lucide="cloud-sun" aria-hidden="true"></i>多云</button>
          <button type="button" data-weather="rain" aria-pressed="false"><i data-lucide="cloud-rain" aria-hidden="true"></i>下雨</button>
          <button type="button" data-weather="snow" aria-pressed="false"><i data-lucide="snowflake" aria-hidden="true"></i>下雪</button>
          <button type="button" data-end-demo>回到实况</button>
        </div>
        <section class="cavy-hero" data-condition="cloudy" data-playing="false" aria-labelledby="cavy-today">
          <div class="cavy-art" aria-hidden="true">
            <img class="cavy-scene is-visible" data-scene="xian" src="assets/xian.webp" alt="" decoding="async">
            <img class="cavy-scene" data-scene="neutral" src="assets/neutral.webp" alt="" decoding="async">
            <div class="cavy-sky">
              <span data-sky="clear"></span>
              <span data-sky="cloudy"></span>
              <span data-sky="rain"></span>
              <span data-sky="snow"></span>
            </div>
            <div class="cavy-frost"></div>
          </div>
          <canvas class="cavy-atmosphere" aria-hidden="true"></canvas>
          <button class="cavy-pet" type="button" aria-label="和豚豚打招呼">
            <span class="cavy-pet-shadow"></span>
            <span class="cavy-pet-response">
              <span class="cavy-pet-body">
                <img class="cavy-pet-image" src="assets/mascot.webp" alt="" decoding="async">
                <img class="cavy-pet-blink" src="assets/blink.webp" alt="" decoding="async">
              </span>
            </span>
            <span class="cavy-pet-action" aria-hidden="true">打招呼</span>
            <span class="cavy-pet-feedback" aria-hidden="true" hidden>嗨！</span>
          </button>
          <div class="cavy-shade" aria-hidden="true"></div>
          <span class="cavy-landscape" data-landscape>古城墙</span>
          <div class="cavy-reading">
            <div class="cavy-reading-heading">
              <h2 class="cavy-heading" id="cavy-today">今日天气</h2>
              <span class="cavy-demo-badge" data-demo-badge hidden>演示</span>
            </div>
            <div class="cavy-temperature" data-readout><span data-value="current">—</span><sup hidden>°C</sup></div>
            <div class="cavy-condition">
              <span class="cavy-condition-icon" data-current-icon aria-hidden="true"><i data-lucide="cloud-sun"></i></span>
              <span data-value="condition">天气待更新</span>
            </div>
            <p class="cavy-feels" data-value="feels" hidden></p>
            <p class="cavy-range" data-value="range" hidden></p>
            <p class="cavy-weather-detail" data-value="detail" hidden></p>
          </div>
        </section>
        <aside class="cavy-note" aria-label="豚豚手记">
          <span class="cavy-note-label"><i data-lucide="notebook-pen" aria-hidden="true"></i>豚豚手记</span>
          <p data-value="note">天气更新后，豚豚会来记一笔。</p>
        </aside>
      </div>

      <div class="cavy-forecast">
        <section class="cavy-panel" aria-labelledby="cavy-hourly">
          <div class="cavy-panel-heading">
            <h2 class="cavy-heading" id="cavy-hourly">逐时预报</h2>
            <div class="cavy-hour-controls" role="group" aria-label="逐时预报时段">
              <button class="cavy-icon-button" type="button" data-hour-previous aria-label="前一组时段" disabled><i data-lucide="chevron-left" aria-hidden="true"></i></button>
              <button class="cavy-icon-button" type="button" data-hour-next aria-label="后一组时段" disabled><i data-lucide="chevron-right" aria-hidden="true"></i></button>
            </div>
          </div>
          <p class="cavy-empty" data-empty-hours>暂无逐时预报</p>
          <div class="cavy-hour-scroll" role="region" aria-label="逐时天气曲线" tabindex="0" hidden>
            <div class="cavy-hour-track">
              <div class="cavy-hours" aria-hidden="true"></div>
              <svg class="cavy-graph" role="img" aria-label="逐时气温" xmlns="http://www.w3.org/2000/svg">
                <g class="cavy-grid"></g>
                <path class="cavy-curve" fill="none"></path>
                <g class="cavy-points"></g>
              </svg>
            </div>
          </div>
        </section>

        <section class="cavy-panel" aria-labelledby="cavy-weekly">
          <h2 class="cavy-heading" id="cavy-weekly">七日预报</h2>
          <p class="cavy-empty" data-empty-week>暂无七日预报</p>
          <ul class="cavy-week" hidden></ul>
        </section>
      </div>

      <section class="cavy-panel cavy-metrics-panel" aria-labelledby="cavy-metrics">
        <h2 class="cavy-heading" id="cavy-metrics">天气细节</h2>
        <dl class="cavy-metrics">
          <div><dt><i data-lucide="droplet" aria-hidden="true"></i>湿度</dt><dd data-value="humidity">—</dd></div>
          <div><dt><i data-lucide="wind" aria-hidden="true"></i><span data-value="windDirection">风力</span></dt><dd data-value="wind">—</dd></div>
          <div><dt><i data-lucide="sun" aria-hidden="true"></i>紫外线</dt><dd data-value="uv">—</dd></div>
          <div><dt><i data-lucide="sunset" aria-hidden="true"></i>日落</dt><dd data-value="sunset">—</dd></div>
        </dl>
      </section>
      <footer class="cavy-data-credit"><a href="https://uapis.cn/docs/api-reference/get-misc-weather">天气数据 · UAPI</a></footer>
      <p class="cavy-visually-hidden" data-announcement role="status"></p>
    </div>

    <dialog class="cavy-location-dialog" aria-labelledby="cavy-location-title">
      <div class="cavy-dialog-heading">
        <h2 id="cavy-location-title">切换城市</h2>
        <button type="button" class="cavy-icon-button" data-close-location aria-label="关闭">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="cavy-location-list">
        <button type="button" data-location="西安" aria-pressed="true">
          <i data-lucide="map-pin" aria-hidden="true"></i>
          <span class="cavy-location-name">西安<span>古城墙</span></span>
          <i data-lucide="check" aria-hidden="true"></i>
        </button>
      </div>
      <form class="cavy-location-form">
        <label for="cavy-other-city">其他城市</label>
        <div class="cavy-location-input">
          <input id="cavy-other-city" name="city" type="text" placeholder="输入城市名" maxlength="24" required autocomplete="off">
          <button type="submit">查看</button>
        </div>
      </form>
    </dialog>
  </article>
</div>
</body>
</html>
