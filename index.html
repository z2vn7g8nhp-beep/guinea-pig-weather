  const saved=cached(city)||(city==='杭州'?starter:null);
  if(select&&!saved){$('feedback').textContent='暂时查不到这座城市，请检查网络或换个城市名。';return}
  if(select&&saved){entry=saved;query=city;page=0;prefs.set('city',city);render();$('picker').close()}
  status('已存预报 · 重试');
 }finally{clearTimeout(timer);if(id===request){busy=false;$('refresh').disabled=false}}
}
$('choose').onclick=()=>{$('feedback').textContent='';$('cityInput').value='';$('picker').showModal()};
document.querySelector('.close').onclick=()=>$('picker').close();
$('picker').addEventListener('click',e=>{if(e.target===$('picker')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('picker').close()}});
$('picker').addEventListener('close',()=>{if(busy){++request;controller.abort();busy=false;$('refresh').disabled=false;status('已存预报 · 刷新')}});
$('searchForm').onsubmit=e=>{e.preventDefault();const v=$('cityInput').value.trim();if(v)update(v,true)};
for(const name of ['北京','上海','广州','深圳','杭州','成都','西安','武汉','南京','重庆','苏州','厦门']){const b=document.createElement('button');b.type='button';b.textContent=name;b.onclick=()=>update(name,true);$('citylist').append(b)}
$('prev').onclick=()=>{page--;renderHours()};$('next').onclick=()=>{page++;renderHours()};
for(const [id,f] of [['celsius',false],['fahren',true]])$(id).onclick=()=>{fahrenheit=f;prefs.set('unit',f?'F':'C');render()};
$('refresh').onclick=()=>update(query);
document.querySelectorAll('nav a,.brand').forEach(a=>a.onclick=()=>{document.querySelectorAll('nav a').forEach(link=>link.classList.toggle('active',link.hash===a.hash))});
render();status('已存预报 · '+clock(entry.at));
if(!cached(query)||Date.now()-entry.at>600000)update(query);else status(clock(entry.at)+' 已更新');
window.addEventListener('online',()=>{if(!busy)update(query)});
if ('serviceWorker' in navigator) {
  const workers = navigator.serviceWorker;
  if (workers.controller) {
    workers.addEventListener('controllerchange', () => location.reload(), { once: true });
  }
  workers.register('./sw.js', { updateViaCache: 'none' })
    .then(registration => registration.update())
    .catch(() => {});
}
</script></body></html>
